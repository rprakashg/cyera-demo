# Stand-in for the real Cyera SaaS platform (what the agent normally polls
# over the internet). In a real deployment, nothing here exists in the
# customer's cluster - this is purely to make the demo runnable without a
# live Cyera account.
apiVersion: v1
kind: Secret
metadata:
  name: agent-api-key
  namespace: cyera-demo
type: Opaque
stringData:
  AGENT_API_KEY: demo-privacy-api-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: cyera-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: control-plane}
  template:
    metadata:
      labels: {app: control-plane}
    spec:
      containers:
        - name: control-plane
          image: quay.io/rprakashg/cyera-control-plane:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          env:
            - name: AGENT_API_KEY
              valueFrom: {secretKeyRef: {name: agent-api-key, key: AGENT_API_KEY}}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: cyera-demo
spec:
  selector: {app: control-plane}
  ports: [{port: 8080, targetPort: 8080}]
  # NodePort so you can hit /admin endpoints from your laptop during the demo
  type: NodePort
