# Maps to: a real Cyera "Custom API Connection"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector
  namespace: cyera-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: connector}
  template:
    metadata:
      labels: {app: connector}
    spec:
      containers:
        - name: connector
          image: quay.io/rprakashg/cyera-connector:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: connector
  namespace: cyera-demo
spec:
  selector: {app: connector}
  ports: [{port: 8080, targetPort: 8080}]
